name: Allerta pressione

on:
  schedule:
    # Ogni 20 minuti ai minuti :09 :29 :49, SFASATO rispetto al workflow del
    # vento (che gira a :00 :15 :30 :45): cosi' le due letture delle stazioni
    # non si sovrappongono. Solo nella stagione velica (mesi 5-9). Gira tutto
    # il giorno per avere gia' pronto lo storico di 3 ore alle 9 del mattino;
    # gli avvisi pero' partono solo in fascia oraria (gestita nel codice).
    - cron: "9,29,49 * * 5-9 *"
  workflow_dispatch: {}     # avvio manuale dalla scheda Actions (per provare)

permissions:
  contents: write          # serve per ri-committare state.json

jobs:
  pressione:
    runs-on: ubuntu-latest
    concurrency:
      # Stesso gruppo del workflow vento: le esecuzioni vengono serializzate,
      # cosi' non si pestano i piedi nel commit di state.json.
      group: allerta-vento
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla la pressione
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_PRESSIONE: "1"
        run: python meteo_check.py

      - name: Salva lo stato aggiornato
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aggiorna stato allerta pressione [skip ci]"
            git push
          else
            echo "Nessun cambiamento di stato."
          fi
