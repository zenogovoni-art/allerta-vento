name: Allerta pressione

# SOLO manuale, per provare il controllo a comando. Dal 28/07/2026 la
# pressione viene letta dentro il giro dei 15 minuti (workflow meteo), sulle
# stesse letture delle stazioni: era programmato ogni 20 minuti ma il cron di
# GitHub lo faceva girare in modo irregolare, da 1 a 4 ore, e con una finestra
# di 195 minuti la tendenza a volte non era nemmeno calcolabile.
on:
  workflow_dispatch: {}

permissions:
  contents: write          # serve per ri-committare state.json

jobs:
  pressione:
    runs-on: ubuntu-latest
    concurrency:
      # Stesso gruppo del workflow vento: le esecuzioni vengono serializzate,
      # cosi' non si pestano i piedi nel commit di state.json.
      group: allerta-vento
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla la pressione
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_PRESSIONE: "1"
        run: python meteo_check.py

      - name: Salva lo stato aggiornato
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aggiorna stato allerta pressione [skip ci]"
            git push
          else
            echo "Nessun cambiamento di stato."
          fi
