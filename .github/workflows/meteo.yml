name: Allerta vento

on:
  schedule:
    # Ogni 15 minuti, ma SOLO da meta' aprile a settembre: e' la stagione
    # velica. Nel resto dell'anno il workflow non parte proprio, cosi' si
    # evitano esecuzioni inutili quando le stazioni meteo d'inverno spesso
    # non funzionano bene. Due righe perche' il campo giorno-del-mese non
    # puo' essere combinato con "da meta' aprile": dal 12/4/2027 riparte da
    # sola la pubblicazione (fermata il 21/9/2026 per la chiusura del
    # circolo velico, vedi PAUSA_DAL/PAUSA_AL in meteo_check.py); dal 2028 in
    # poi la stagione partira' quindi dal 12 aprile invece che dal 1 maggio.
    # Attenzione: l'orario del cron e' in UTC e GitHub puo' ritardare
    # l'esecuzione di qualche minuto nei momenti di carico.
    - cron: "*/15 * 12-30 4 *"
    - cron: "*/15 * * 5-9 *"
  workflow_dispatch:      # permette l'avvio manuale dalla scheda Actions
    inputs:
      test_telegram:
        description: "Invia un messaggio di prova su Telegram"
        type: boolean
        default: false
      pulizia_canale:
        description: "Svuota SUBITO il canale (test pulizia settimanale)"
        type: boolean
        default: false

permissions:
  contents: write          # serve per ri-committare state.json

jobs:
  controllo:
    runs-on: ubuntu-latest
    concurrency:
      group: allerta-vento  # evita esecuzioni sovrapposte
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla il vento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Chat privata admin per il watchdog guasti stazioni (opzionale)
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
          PULIZIA_CANALE: ${{ inputs.pulizia_canale }}
        run: python meteo_check.py

      - name: Salva lo stato aggiornato
        run: |
          # Oltre a state.json si salva anche storico/ (l'archivio CSV delle
          # letture, scritto una volta al giorno al cambio di data). La
          # cartella viene inclusa solo se esiste: passare a git un percorso
          # inesistente fa fallire il job con "pathspec did not match".
          paths="state.json"
          [ -d storico ] && paths="$paths storico"
          if [[ -n "$(git status --porcelain $paths)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $paths
            git commit -m "Aggiorna stato allerta vento [skip ci]"
            # Il checkout fotografa lo SHA al momento del trigger, non la
            # punta di main: se un altro run ha pushato nel frattempo il push
            # verrebbe respinto. Riallineiamo prima con un rebase; in caso di
            # conflitto su state.json vince la nostra versione (la lettura
            # piu' recente): durante un rebase "theirs" indica il commit
            # locale che viene riapplicato.
            git pull --rebase --autostash -X theirs
            git push
          else
            echo "Nessun cambiamento di stato."
          fi
