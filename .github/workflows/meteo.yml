name: Allerta vento

on:
  schedule:
    # Ogni 15 minuti, ma SOLO da maggio a settembre (campo mese = 5-9): e' la
    # stagione velica. Da ottobre ad aprile il workflow non parte proprio,
    # cosi' si evitano esecuzioni inutili quando le stazioni meteo d'inverno
    # spesso non funzionano bene.
    # Attenzione: l'orario del cron e' in UTC e GitHub puo' ritardare
    # l'esecuzione di qualche minuto nei momenti di carico.
    - cron: "*/15 * * 5-9 *"
  workflow_dispatch:      # permette l'avvio manuale dalla scheda Actions
    inputs:
      test_telegram:
        description: "Invia un messaggio di prova su Telegram"
        type: boolean
        default: false
      pulizia_canale:
        description: "Svuota SUBITO il canale (test pulizia settimanale)"
        type: boolean
        default: false

permissions:
  contents: write          # serve per ri-committare state.json

jobs:
  controllo:
    runs-on: ubuntu-latest
    concurrency:
      group: allerta-vento  # evita esecuzioni sovrapposte
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla il vento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Chat privata admin per il watchdog guasti stazioni (opzionale)
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
          PULIZIA_CANALE: ${{ inputs.pulizia_canale }}
        run: python meteo_check.py

      - name: Salva lo stato aggiornato
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aggiorna stato allerta vento [skip ci]"
            git push
          else
            echo "Nessun cambiamento di stato."
          fi
