name: Allerta vento

on:
  schedule:
    # Ogni 30 minuti. Attenzione: l'orario del cron e' in UTC e GitHub puo'
    # ritardare l'esecuzione di qualche minuto nei momenti di carico.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permette l'avvio manuale dalla scheda Actions

permissions:
  contents: write          # serve per ri-committare state.json

jobs:
  controllo:
    runs-on: ubuntu-latest
    concurrency:
      group: allerta-vento  # evita esecuzioni sovrapposte
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla il vento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python meteo_check.py

      - name: Salva lo stato aggiornato
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aggiorna stato allerta vento [skip ci]"
            git push
          else
            echo "Nessun cambiamento di stato."
          fi
