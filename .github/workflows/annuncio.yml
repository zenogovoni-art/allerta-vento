name: Pubblica annuncio

# Pubblica sul canale Telegram il contenuto di annuncio.md.
# Parte SOLO manualmente (dalla scheda Actions o via comando), cosi' l'annuncio
# va sul canale solo dopo che e' stato letto e approvato.
on:
  workflow_dispatch:
    inputs:
      foto_prima:
        description: "Manda prima la foto e poi il testo (invece del solito testo poi foto)"
        type: boolean
        default: false

jobs:
  annuncio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Pubblica l'annuncio sul canale
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INVIA_ANNUNCIO: "1"
          ANNUNCIO_FOTO_PRIMA: ${{ inputs.foto_prima }}
        run: python meteo_check.py
