name: Grafico previsioni weekend

on:
  # NIENTE cron schedule: il cron di GitHub Actions e' inaffidabile (throttling,
  # run ritardati di ore o saltati). Il grafico viene avviato da uno SCHEDULER
  # ESTERNO (cron-job.org) che chiama workflow_dispatch via API alle 09:05 ora
  # italiana di GIO/VEN/SAB nei mesi 5-9 (stagione velica) — stessa soluzione
  # usata per il workflow meteo. Ogni giorno il grafico mostra solo i giorni
  # FUTURI del weekend: gio -> ven/sab/dom, ven -> sab/dom, sab -> dom.
  workflow_dispatch: {}     # avvio via cron-job.org e manuale dalla scheda Actions

permissions:
  contents: write          # serve per ri-committare state.json (flag _grafico)

jobs:
  grafico:
    runs-on: ubuntu-latest
    # Stesso gruppo del workflow meteo: i due non girano mai insieme, cosi'
    # non si pestano i piedi committando state.json in parallelo.
    concurrency:
      group: allerta-vento
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera e invia il grafico
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python grafico_settimanale.py

      - name: Salva lo stato aggiornato
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Aggiorna data invio grafico [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "Nessun cambiamento di stato."
          fi
